services:
  postgres:
    image: postgres:16-alpine
    container_name: sender-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sender
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - sender-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sender"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sender-postgres-data:
