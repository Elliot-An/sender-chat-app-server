spring.application.name=backend

# Load backend/.env when the process cwd is backend/ or the repo root.
spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties]

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/sender}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:123456}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

app.jwt.secret=${JWT_SECRET:change-this-development-secret-to-at-least-32-characters}
app.jwt.access-token-minutes=${JWT_ACCESS_TOKEN_MINUTES:15}
app.auth.refresh-token-days=${REFRESH_TOKEN_DAYS:30}
app.cors.allowed-origin=${FRONTEND_URL:http://localhost:3000}

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

app.rate-limit.window=${RATE_LIMIT_WINDOW:1m}
app.rate-limit.max-hits.auth-credentials=${RATE_LIMIT_AUTH_CREDENTIALS_MAX_HITS:10}
app.rate-limit.max-hits.auth-session=${RATE_LIMIT_AUTH_SESSION_MAX_HITS:30}
app.rate-limit.max-hits.password-change=${RATE_LIMIT_PASSWORD_CHANGE_MAX_HITS:5}
app.rate-limit.max-hits.user-search=${RATE_LIMIT_USER_SEARCH_MAX_HITS:30}
app.rate-limit.max-hits.profile-update=${RATE_LIMIT_PROFILE_UPDATE_MAX_HITS:10}
app.rate-limit.max-hits.avatar-upload=${RATE_LIMIT_AVATAR_UPLOAD_MAX_HITS:10}
app.rate-limit.max-hits.friendship-write=${RATE_LIMIT_FRIENDSHIP_WRITE_MAX_HITS:20}
app.rate-limit.max-hits.conversation-write=${RATE_LIMIT_CONVERSATION_WRITE_MAX_HITS:20}
app.rate-limit.max-hits.message-send=${RATE_LIMIT_MESSAGE_SEND_MAX_HITS:60}
app.rate-limit.max-hits.message-search=${RATE_LIMIT_MESSAGE_SEARCH_MAX_HITS:30}
app.rate-limit.max-hits.message-progress=${RATE_LIMIT_MESSAGE_PROGRESS_MAX_HITS:120}
app.rate-limit.max-hits.typing=${RATE_LIMIT_TYPING_MAX_HITS:120}

app.message-progress.flush-ms=${MESSAGE_PROGRESS_FLUSH_MS:2000}

app.s3.bucket=${S3_BUCKET}
app.s3.region=${S3_REGION}
app.s3.public-base-url=${S3_PUBLIC_BASE_URL}
app.s3.access-key=${S3_ACCESS_KEY}
app.s3.secret-key=${S3_SECRET_KEY}
app.s3.presign-seconds=${S3_PRESIGN_SECONDS:300}
app.avatar.max-bytes=${AVATAR_MAX_BYTES:2097152}
